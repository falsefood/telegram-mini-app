<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking Access...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .loader {
            border: 4px solid var(--tg-theme-hint-color, #cccccc);
            border-top: 4px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            margin: 20px 0;
            font-size: 16px;
            line-height: 1.4;
            color: var(--tg-theme-text-color, #000000);
        }
        .error {
            color: var(--tg-theme-destructive-text-color, #ff3b30);
            margin: 10px 0;
        }
        .button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            display: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div id="statusMessage" class="message">Checking access...</div>
    <div id="errorMessage" class="error hidden"></div>
    <a href="#" id="subscribeButton" class="button">Get Subscription</a>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // Function to check subscription status from initData
        function checkSubscription() {
            try {
                // Get subscription data from initData
                const startParam = tg.initDataUnsafe.start_param;
                
                if (!startParam) {
                    throw new Error('No subscription data available');
                }
                
                // The start_param will be 'subscribed' if user has access
                if (startParam === 'subscribed') {
                    // User has active subscription - redirect to main app
                    window.location.href = 'https://falsefood.github.io/telegram-mini-app/';
                } else {
                    // Show subscription required message
                    document.querySelector('.loader').style.display = 'none';
                    document.getElementById('statusMessage').textContent = 
                        'Subscription required to access this content';
                    document.getElementById('subscribeButton').style.display = 'inline-block';
                    
                    // Add click handler for subscribe button
                    document.getElementById('subscribeButton').addEventListener('click', (e) => {
                        e.preventDefault();
                        tg.sendData('request_subscription');
                        tg.close();
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                document.querySelector('.loader').style.display = 'none';
                document.getElementById('statusMessage').style.display = 'none';
                document.getElementById('errorMessage').textContent = 
                    'Unable to verify subscription status. Please try again later.';
                document.getElementById('errorMessage').classList.remove('hidden');
            }
        }

        // Start checking when page loads
        document.addEventListener('DOMContentLoaded', checkSubscription);
    </script>
</body>
</html>
