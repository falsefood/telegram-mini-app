<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking Access...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .loader {
            border: 4px solid var(--tg-theme-hint-color, #cccccc);
            border-top: 4px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            margin: 20px 0;
            font-size: 16px;
            line-height: 1.4;
            color: var(--tg-theme-text-color, #000000);
        }
        .error {
            color: var(--tg-theme-destructive-text-color, #ff3b30);
            margin: 10px 0;
        }
        .debug {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999999);
            margin-top: 20px;
            text-align: left;
            word-break: break-all;
            max-width: 100%;
            padding: 10px;
            display: none;
        }
        .button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            display: none;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <div id="statusMessage" class="message">Checking access...</div>
    <div id="errorMessage" class="error hidden"></div>
    <a href="#" id="subscribeButton" class="button">Get Subscription</a>
    <pre id="debugInfo" class="debug"></pre>

    <script>
        // Initialize Telegram WebApp
        let tg = window.Telegram.WebApp;

        // Function to parse URL parameters
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Function to show debug info
        function showDebug(info) {
            const debugElement = document.getElementById('debugInfo');
            debugElement.textContent = JSON.stringify(info, null, 2);
            debugElement.style.display = 'block';
        }

        // Function to show error message
        function showError(message, debug = null) {
            document.querySelector('.loader').style.display = 'none';
            document.getElementById('statusMessage').style.display = 'none';
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
            document.getElementById('subscribeButton').style.display = 'inline-block';
            
            if (debug) {
                showDebug(debug);
            }
        }

        // Function to check subscription status
        function checkAccess() {
            try {
                const debugMode = getUrlParameter('debug') === '1';
                const debugInfo = {
                    url: window.location.href,
                    webAppReady: tg.isInitialized,
                    platform: tg.platform,
                    version: tg.version,
                    params: {
                        access: getUrlParameter('access'),
                        debug: debugMode
                    }
                };

                console.log('Debug info:', debugInfo);
                if (debugMode) {
                    showDebug(debugInfo);
                }

                // Get subscription status from URL parameters
                const hasAccess = getUrlParameter('access');
                console.log('Access parameter:', hasAccess);

                // Direct access to main app if access is true
                if (hasAccess === 'true') {
                    console.log('Access granted, redirecting...');
                    window.location.href = 'https://falsefood.github.io/telegram-mini-app/';
                    return;
                }

                // Show subscription required message
                document.querySelector('.loader').style.display = 'none';
                document.getElementById('statusMessage').textContent = 
                    'Subscription required to access this content';
                document.getElementById('subscribeButton').style.display = 'inline-block';

                // Add click handler for subscribe button
                document.getElementById('subscribeButton').addEventListener('click', (e) => {
                    e.preventDefault();
                    tg.sendData('request_subscription');
                    tg.close();
                });

            } catch (error) {
                console.error('Error:', error);
                showError('Error checking access: ' + error.message, {
                    error: error.message,
                    stack: error.stack,
                    webAppReady: tg.isInitialized,
                    url: window.location.href
                });
            }
        }

        // Main initialization
        function init() {
            console.log('Initializing...');
            
            try {
                // Expand the WebApp
                tg.expand();
                
                // Check if WebApp is ready
                if (tg.isInitialized) {
                    console.log('WebApp is initialized');
                    checkAccess();
                } else {
                    console.log('WebApp not initialized, waiting...');
                    // Wait for WebApp to be ready
                    tg.ready();
                    setTimeout(checkAccess, 100);
                }
            } catch (error) {
                console.error('Initialization error:', error);
                showError('Initialization error', {
                    error: error.message,
                    webApp: tg,
                    isInitialized: tg.isInitialized
                });
            }
        }

        // Start initialization when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
