<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking Access...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #debug {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 50vh;
            overflow-y: auto;
        }
        .button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: none;
        }
        .message {
            margin: 20px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="message" class="message">Checking access...</div>
    <a href="#" id="subscribeBtn" class="button">Get Subscription</a>
    <div id="debug"></div>

    <script>
        const tg = window.Telegram.WebApp;
        const debug = document.getElementById('debug');
        const message = document.getElementById('message');
        const subscribeBtn = document.getElementById('subscribeBtn');

        // Debug function
        function log(text, data = null) {
            const time = new Date().toTimeString().split(' ')[0];
            const logText = `[${time}] ${text}\n${data ? JSON.stringify(data, null, 2) + '\n' : ''}`;
            console.log(text, data || '');
            debug.textContent += logText;
            debug.scrollTop = debug.scrollHeight;
        }

        // Get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                access: params.get('access'),
                debug: params.get('debug')
            };
        }

        // Show subscription required
        function showSubscriptionRequired() {
            message.textContent = 'Subscription required to access this content';
            subscribeBtn.style.display = 'inline-block';
            subscribeBtn.addEventListener('click', (e) => {
                e.preventDefault();
                tg.sendData('request_subscription');
                tg.close();
            });
        }

        // Main function
        async function init() {
            try {
                log('Initializing WebApp...');
                tg.expand();

                // Get parameters
                const params = getUrlParams();
                log('URL Parameters:', params);

                // Log WebApp state
                log('WebApp State:', {
                    initialized: tg.isInitialized,
                    version: tg.version,
                    platform: tg.platform,
                    initData: tg.initData
                });

                // Check access
                if (params.access === 'true') {
                    log('Access granted, redirecting...');
                    message.textContent = 'Access granted, redirecting...';
                    window.location.href = 'main.html';
                } else {
                    log('Access denied');
                    showSubscriptionRequired();
                }
            } catch (error) {
                log('Error:', {
                    message: error.message,
                    stack: error.stack
                });
                message.textContent = 'Error: ' + error.message;
            }
        }

        // Start when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
