<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .content {
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        #debug {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 50vh;
            overflow-y: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Mini App</h1>
        </div>
        <div class="content">
            <p>You have successfully accessed the app!</p>
            <p>Your subscription is active.</p>
        </div>
    </div>
    <div id="debug"></div>

    <script>
        const tg = window.Telegram.WebApp;
        const debug = document.getElementById('debug');

        // Debug function
        function log(text, data = null) {
            const time = new Date().toTimeString().split(' ')[0];
            const logText = `[${time}] ${text}\n${data ? JSON.stringify(data, null, 2) + '\n' : ''}`;
            console.log(text, data || '');
            if (debug.style.display === 'block') {
                debug.textContent += logText;
                debug.scrollTop = debug.scrollHeight;
            }
        }

        // Get URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                access: params.get('access'),
                debug: params.get('debug')
            };
        }

        // Main function
        async function init() {
            try {
                log('Initializing main app...');
                tg.expand();

                const params = getUrlParams();
                log('URL Parameters:', params);

                // Show debug panel if debug parameter is present
                if (params.debug === '1') {
                    debug.style.display = 'block';
                }

                // Verify access
                if (params.access !== 'true') {
                    log('Access verification failed, redirecting to check...');
                    window.location.href = 'redirect.html';
                    return;
                }

                // Log WebApp state
                log('WebApp State:', {
                    initialized: tg.isInitialized,
                    version: tg.version,
                    platform: tg.platform,
                    initData: tg.initData
                });

                // App is ready
                tg.ready();
            } catch (error) {
                log('Error:', {
                    message: error.message,
                    stack: error.stack
                });
                alert('Error: ' + error.message);
            }
        }

        // Start when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
