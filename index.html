<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            color: var(--tg-theme-text-color, #000);
            background: var(--tg-theme-bg-color, #fff);
        }
        .button {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px 0;
            width: 100%;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 10px;
            padding: 16px;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Welcome to Mini App!</h2>
        <p>This is a simple Telegram Mini App.</p>
        <p>User: <span id="username">Loading...</span></p>
    </div>

    <button class="button" onclick="sendMessage()">Send Message</button>
    <button class="button" onclick="showAlert()">Show Alert</button>

    <script>
        // Initialize Telegram WebApp
        const webapp = window.Telegram.WebApp;
        webapp.ready();

        // Set theme
        document.documentElement.style.setProperty('--tg-theme-bg-color', webapp.backgroundColor);
        document.documentElement.style.setProperty('--tg-theme-text-color', webapp.textColor);
        document.documentElement.style.setProperty('--tg-theme-button-color', webapp.buttonColor);
        document.documentElement.style.setProperty('--tg-theme-button-text-color', webapp.buttonTextColor);

        // Display user info
        document.getElementById('username').textContent = webapp.initDataUnsafe.user?.username || 'Guest';

        // Functions
        function sendMessage() {
            webapp.sendData("Hello from Mini App!");
        }

        function showAlert() {
            webapp.showAlert("This is a Mini App alert!");
        }

        // Close app when back button is pressed
        webapp.BackButton.onClick(() => {
            webapp.close();
        });
    </script>
</body>
</html>
